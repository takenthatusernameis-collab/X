      - name: Deep audit — after Independent research-process evaluation
        id: deep_audit_process_evaluation
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.process_evaluation.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xone --step "Independent research-process evaluation"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
