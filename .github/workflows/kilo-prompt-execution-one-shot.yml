          git diff --cached --name-status
          echo "--- recent commits ---"
          git log -5 --format='%h %ct %s'
          for debug_path in state/worker_progress.md state/worker_receipt.json state/activation_receipt.json reports logs; do
            if [ -e "$debug_path" ]; then
              stat -c '%n | type=%F | bytes=%s | mode=%a | mtime=%y' "$debug_path"
            else
              echo "ABSENT | $debug_path"
            fi
          done
          echo "::endgroup::"

          echo "::group::REPORT KILO OUTCOME DEBUG — terminal-state matrix"
          case "${PERSISTENCE_STATUS:-FAILED}" in
            MAIN|RECOVERY_BRANCH|NO_CHANGES|FAILED) echo "Persistence token recognized: ${PERSISTENCE_STATUS:-FAILED}" ;;
            *) echo "UNRECOGNIZED persistence token: ${PERSISTENCE_STATUS:-<unset>}" ;;
          esac
          case "${KILO_LIVENESS_STATUS:-unknown}" in
            STALLED|COMPLETED_WITHOUT_SEMANTIC_CHECKPOINT|COMPLETED_WITH_SEMANTIC_CHECKPOINTS|COMPLETED_WITH_POSTWORKER_VERIFICATION|unknown) echo "Liveness token: ${KILO_LIVENESS_STATUS:-unknown}" ;;
            *) echo "UNRECOGNIZED liveness token: ${KILO_LIVENESS_STATUS:-<unset>}" ;;
          esac
          echo "::endgroup::"

          echo "::group::REPORT KILO OUTCOME — authoritative deterministic classifier"
          echo "The Python classifier is the single authoritative terminal-state decision path."
          echo "::endgroup::"

          set -euo pipefail
          python3 .github/scripts/report_kilo_outcome.py \
            --preflight "${PREFLIGHT_OUTCOME:-unknown}" \
            --smoke "${KILO_SMOKE_OUTCOME:-unknown}" \
            --worker "${KILO_OUTCOME:-unknown}" \
            --verify "${VERIFY_OUTCOME:-skipped}" \
            --liveness "${KILO_LIVENESS_STATUS:-unknown}" \
            --persistence "${PERSISTENCE_STATUS:-FAILED}" \
            --process "${PROCESS_OUTCOME:-UNVERIFIED}"

      - name: Deep audit — after Report Kilo outcome
        id: deep_audit_14_report_kilo_outcome
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_14_report_kilo_outcome.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xone --step "Report Kilo outcome"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Deep audit — final rollup
        id: deep_audit_final
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xone --final
          rc=$?
          echo "DEEP_AUDIT_FINAL_RC=$rc"
          exit 0