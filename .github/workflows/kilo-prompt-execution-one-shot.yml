name: Kilo Prompt Execution One Shot

on:
  push:
    paths:
      - ".kilo/wakeup-prompt.md"

concurrency:
  group: kilo-research-enterprise
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm install -g @kilocode/cli
      - run: kilo --version
