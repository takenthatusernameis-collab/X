        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.independent_verify.outcome }}
          WORKER_OUTCOME: ${{ steps.kilo.outcome }}
          LIVENESS_STATUS: ${{ env.KILO_LIVENESS_STATUS }}
        run: |
          set +e
          python3 .github/scripts/evaluate_research_process.py \
