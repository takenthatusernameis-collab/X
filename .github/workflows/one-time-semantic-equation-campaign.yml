name: One-Time Semantic Equation Campaign

on:
  push:
    paths:
      - "state/smoke/SEMANTIC_EQUATION_TEST_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: one-time-semantic-equation-campaign
  cancel-in-progress: false

jobs:
  semantic-equation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kilo Code CLI
        run: npm install -g @kilocode/cli

      - name: Discover and configure free Kilo model
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request("https://api.kilo.ai/api/gateway/models", headers={"Accept": "application/json"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)

          free = [
              m for m in payload.get("data", [])
              if isinstance(m.get("id"), str) and m["id"].endswith(":free")
          ]

          def tool_capable(model):
              values = model.get("supported_parameters") or []
              return bool(
                  model.get("tool_calling")
                  or model.get("tool_call")
                  or any(str(v).lower() in {"tools", "tool_choice"} for v in values)
              )

          candidates = [m for m in free if tool_capable(m)]
          candidates.sort(key=lambda m: m.get("id", ""))
          if not candidates:
              raise SystemExit("No tool-capable free Kilo model available")

          selected = candidates[0]
          model_id = selected["id"]
          model_name = selected.get("name") or model_id

          config = {
              "$schema": "https://app.kilo.ai/config.json",
              "enabled_providers": ["openai-compatible"],
              "model": "openai-compatible/free-kilo",
              "small_model": "openai-compatible/free-kilo",
              "subagent_model": "openai-compatible/free-kilo",
              "provider": {
                  "openai-compatible": {
                      "options": {"baseURL": "https://api.kilo.ai/api/gateway"},
                      "models": {"free-kilo": {"id": model_id, "name": model_name, "tool_call": True}},
                  }
              },
              "sandbox": {
                  "enabled": False,
                  "network": "allow",
                  "allowed_hosts": [
                      "github.com:443", "api.github.com:443", "raw.githubusercontent.com:443",
                      "api.kilo.ai:443", "pypi.org:443", "files.pythonhosted.org:443",
                      "registry.npmjs.org:443"
                  ],
              },
          }

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)
          print("Configured free Kilo model: " + model_id)
          PY

      - name: Verify Kilo installation
        run: kilo --version

      - name: Snapshot the production semantic path for this one-time test
        run: |
          set -euo pipefail
          test -f .kilo/wakeup-prompt.md
          mkdir -p state/smoke/semantic_equation
          cp .kilo/wakeup-prompt.md state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          sha256sum .kilo/wakeup-prompt.md | cut -d' ' -f1 > state/smoke/semantic_equation/SEMANTIC_PATH_SOURCE_SHA256.txt
          sha256sum state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md | cut -d' ' -f1 > state/smoke/semantic_equation/SEMANTIC_PATH_COPY_SHA256.txt
          cmp -s .kilo/wakeup-prompt.md state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          echo "SEMANTIC_PATH_COPY=EXACT" > state/smoke/semantic_equation/SEMANTIC_PATH_COPY_STATUS.txt

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v kilo
          python3 --version
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_SOURCE_SHA256.txt
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_COPY_SHA256.txt
          grep -q '^SEMANTIC_PATH_COPY=EXACT
          One-time semantic-path smoke test.
          Production research state must not be modified for this test.
          Each fresh agent must independently solve:
          ((37 * 19) - (14 * 11)) + 23
          Expected result: 572
          EOF

      - name: Run 10 fresh semantic-path agents
        id: semantic_campaign
        continue-on-error: true
        timeout-minutes: 110
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail

          expected="572"
          failures=0
          successes=0
          semantic_progress_seen=0

          cat > /tmp/semantic-equation-controller-prompt <<'EOF'
          ONE-TIME SEMANTIC-PATH TEST

          You are one fresh agent in a 10-agent sequential controller test.
          This is NOT a research activation and must NOT modify production research state.

          Your only task:
          1. Read the exact copied semantic path at:
             state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          2. Follow that copied semantic path as the execution contract for this test, but use the equation below as the sole bounded objective and do not perform any research or production-state action.
          3. Independently calculate this exact equation:
             ((37 * 19) - (14 * 11)) + 23
          4. The correct answer is expected to be 572, but derive it yourself.
          5. Write a concise result file at:
             state/smoke/semantic_equation/agent_AGENT_ID.md
          6. Update the shared semantic checkpoint:
             state/smoke/semantic_equation/semantic_checkpoint.md
             with the current agent ID, the derived answer, and a one-line milestone.
          5. Do not modify .github/**, .kilo/**, AGENTS.md, ENTERPRISE.md, or production research state.
          6. Do not launch other agents, workflows, or recursive sessions.
          7. Do not commit or push.

          The controller will independently verify your files and answer.
          EOF

          for index in $(seq 1 10); do
            printf -v agent_id "%02d" "$index"
            result_file="state/smoke/semantic_equation/agent_${agent_id}.md"

            before_checkpoint="$(sha256sum state/smoke/semantic_equation/semantic_checkpoint.md 2>/dev/null | cut -d' ' -f1 || true)"
            prompt="$(sed "s/AGENT_ID/${agent_id}/g" /tmp/semantic-equation-controller-prompt)"

            echo "=== START AGENT ${agent_id}/10 ==="
            status=0
            if timeout --foreground --signal=TERM --kill-after=30s 10m kilo run --model openai-compatible/free-kilo --auto "$prompt" > "state/smoke/semantic_equation/agent_${agent_id}.log" 2>&1; then
              status=0
            else
              status=$?
            fi

            after_checkpoint="$(sha256sum state/smoke/semantic_equation/semantic_checkpoint.md 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$after_checkpoint" != "$before_checkpoint" ]; then
              semantic_progress_seen=1
            fi

            if [ "$status" -eq 0 ] && [ -f "$result_file" ] && [ -f state/smoke/semantic_equation/semantic_checkpoint.md ]; then
              answer="$(grep -Eio 'answer[^0-9]*[0-9]+' "$result_file" | tail -1 | grep -Eo '[0-9]+' | tail -1 || true)"
              if [ "$answer" = "$expected" ]; then
                agent_status="VERIFIED_ANSWER"
                successes=$((successes + 1))
              else
                agent_status="WRONG_OR_UNREADABLE_ANSWER"
                failures=$((failures + 1))
              fi
            else
              agent_status="WORKER_FAILED_OR_MISSING_CHECKPOINT"
              failures=$((failures + 1))
            fi

            {
              echo "agent: ${agent_id}"
              echo "worker_exit_code: ${status}"
              echo "status: ${agent_status}"
              echo "expected_answer: ${expected}"
              echo "verified_result_file: $([ -f "$result_file" ] && echo true || echo false)"
              echo "verified_checkpoint_file: $([ -f state/smoke/semantic_equation/semantic_checkpoint.md ] && echo true || echo false)"
              echo
              echo "This controller record is execution evidence only."
            } > "state/smoke/semantic_equation/controller_${agent_id}.md"

            echo "AGENT_${agent_id}_STATUS=${agent_status}"
          done

          cat > state/smoke/semantic_equation/summary.md <<EOF
          # One-Time Semantic Equation Campaign

          expected_answer: ${expected}
          agent_count: 10
          verified_answer_count: ${successes}
          failure_count: ${failures}
          semantic_progress_seen: ${semantic_progress_seen}
          EOF

          test "$successes" -eq 10
          test "$failures" -eq 0
          test "$semantic_progress_seen" -eq 1

      - name: Independent controller verification
        if: always()
        run: |
          set -euo pipefail

          expected="572"

          test -f state/smoke/semantic_equation/summary.md
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_SOURCE_SHA256.txt
          test -f state/smoke/semantic_equation/SEMANTIC_PATH_COPY_SHA256.txt
          cmp -s .kilo/wakeup-prompt.md state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          test "$(cat state/smoke/semantic_equation/SEMANTIC_PATH_SOURCE_SHA256.txt)" = "$(cat state/smoke/semantic_equation/SEMANTIC_PATH_COPY_SHA256.txt)"
          grep -q "verified_answer_count: 10" state/smoke/semantic_equation/summary.md
          grep -q "failure_count: 0" state/smoke/semantic_equation/summary.md
          grep -q "semantic_progress_seen: 1" state/smoke/semantic_equation/summary.md

          for index in $(seq 1 10); do
            printf -v agent_id "%02d" "$index"
            result_file="state/smoke/semantic_equation/agent_${agent_id}.md"
            checkpoint="state/smoke/semantic_equation/semantic_checkpoint.md"
            test -f "$result_file"
            test -f "$checkpoint"
            grep -Eiq "572" "$result_file"
          done

          echo "SEMANTIC_EQUATION_CONTROLLER=PASS"
          echo "All 10 fresh agents produced independently persisted result files containing 572."
          echo "Shared semantic checkpoint path changed during the campaign."
 state/smoke/semantic_equation/SEMANTIC_PATH_COPY_STATUS.txt
          cmp -s .kilo/wakeup-prompt.md state/smoke/semantic_equation/SEMANTIC_PATH_COPY.md
          mkdir -p state/smoke/semantic_equation
          cat > state/smoke/semantic_equation/README.md <<'EOF'
