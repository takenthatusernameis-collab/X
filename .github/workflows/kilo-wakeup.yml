name: Kilo Research Enterprise Wake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: kilo-research-enterprise
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kilo:
    name: Autonomous Kilo activation
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Kilo Code CLI
        run: npm install -g @kilocode/cli

      - name: Verify Kilo installation
        run: kilo --version

      - name: Diagnose Kilo API key
        id: kilo_auth
        continue-on-error: true
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_PROVIDER: "kilo"
        run: |
          set -euo pipefail

          if [ -z "$KILO_API_KEY" ]; then
            echo "KILO_API_KEY_CHECK=NOT_CONFIGURED"
            {
              echo "### Kilo API key diagnostic"
              echo "KILO_API_KEY: **not configured**"
              echo
              echo "The workflow can still use the free model anonymously."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if kilo profile --json >/tmp/kilo-profile.json 2>/tmp/kilo-profile.err; then
            echo "KILO_API_KEY_CHECK=VALID"
            {
              echo "### Kilo API key diagnostic"
              echo "KILO_API_KEY: **valid** — authenticated Kilo profile request succeeded."
              echo
              echo "The key itself was not printed or persisted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Eiq '401|unauthorized|invalid[^[:space:]]*[[:space:]]+(api[[:space:]-]?key|token)|authentication[^[:space:]]*failed' /tmp/kilo-profile.err /tmp/kilo-profile.json 2>/dev/null; then
            echo "::error::KILO_API_KEY_CHECK=INVALID"
            {
              echo "### Kilo API key diagnostic"
              echo "KILO_API_KEY: **invalid or rejected** — Kilo returned an authentication failure."
              echo
              echo "The key itself was not printed or persisted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::warning::KILO_API_KEY_CHECK=UNVERIFIED"
          {
            echo "### Kilo API key diagnostic"
            echo "KILO_API_KEY: **unverified** — the profile request failed, but the failure did not match a documented authentication error."
            echo
            echo "The key itself was not printed or persisted."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Prepare trusted Kilo configuration
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/kilo"
          cat > "$HOME/.config/kilo/kilo.json" <<'JSON'
          {
            "$schema": "https://app.kilo.ai/config.json",
            "enabled_providers": [
              "openai-compatible",
              "kilo"
            ],
            "model": "openai-compatible/minimax-m3-free",
            "small_model": "openai-compatible/minimax-m3-free",
            "subagent_model": "openai-compatible/minimax-m3-free",
            "provider": {
              "kilo": {
                "options": {
                  "apiKey": "{env:KILO_API_KEY}"
                }
              },
              "openai-compatible": {
                "options": {
                  "baseURL": "https://api.kilo.ai/api/gateway"
                },
                "models": {
                  "minimax-m3-free": {
                    "id": "minimax/minimax-m3:free",
                    "name": "MiniMax M3 (free)",
                    "tool_call": true,
                    "limit": {
                      "context": 1048576,
                      "output": 943718
                    }
                  }
                }
              }
            },
            "sandbox": {
              "enabled": true,
              "network": "deny",
              "allowed_hosts": [
                "github.com:443",
                "api.github.com:443",
                "raw.githubusercontent.com:443",
                "api.kilo.ai:443",
                "pypi.org:443",
                "files.pythonhosted.org:443",
                "registry.npmjs.org:443"
              ]
            }
          }
          JSON
          chmod 600 "$HOME/.config/kilo/kilo.json"

      - name: Validate trusted Kilo configuration
        run: |
          set -euo pipefail
          test "$(stat -c '%a' "$HOME/.config/kilo/kilo.json")" = "600"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          config = json.loads(path.read_text(encoding="utf-8"))
          assert config["enabled_providers"] == ["openai-compatible", "kilo"]
          assert config["model"] == "openai-compatible/minimax-m3-free"
          assert config["small_model"] == "openai-compatible/minimax-m3-free"
          assert config["subagent_model"] == "openai-compatible/minimax-m3-free"
          gateway = config["provider"]["openai-compatible"]
          assert gateway["options"]["baseURL"] == "https://api.kilo.ai/api/gateway"
          assert gateway["options"]["apiKey"] == "{env:KILO_API_KEY}"
          model = gateway["models"]["minimax-m3-free"]
          assert model["id"] == "minimax/minimax-m3:free"
          assert model["tool_call"] is True
          assert config["sandbox"]["enabled"] is True
          assert config["sandbox"]["network"] == "deny"
          assert "api.kilo.ai:443" in config["sandbox"]["allowed_hosts"]
          print("Trusted Kilo configuration validated.")
          PY

      - name: Run Kilo
        id: kilo
        continue-on-error: true
        timeout-minutes: 340
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail
          kilo run --model openai-compatible/minimax-m3-free --auto "$(cat .kilo/wakeup-prompt.md)"

      - name: Persist safe repository changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KILO_OUTCOME: ${{ steps.kilo.outcome }}
        run: |
          set -euo pipefail

          # Autonomous Kilo is not allowed to persist changes to its authority/security boundary.
          git restore --worktree --staged -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md 2>/dev/null || true
          git reset -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md 2>/dev/null || true

          git add -A

          if git diff --cached --name-only | grep -E '(^|/)(\.github/workflows/|\.kilo/)|^(AGENTS\.md|ENTERPRISE\.md|MANUAL_SETUP\.md)$' >/tmp/kilo_protected_paths; then
            echo "Protected paths unexpectedly staged:"
            cat /tmp/kilo_protected_paths
            exit 1
          fi

          # Common high-risk secret signatures must never enter the public repository.
          if git diff --cached --binary | grep -E -n 'eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' >/tmp/kilo_secret_scan; then
            echo "Potential secret material detected in staged changes:"
            cat /tmp/kilo_secret_scan
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No safe repository changes to persist."
            exit 0
          fi

          git config user.name "kilo-research-enterprise"
          git config user.email "kilo-research-enterprise@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"

          git commit -m "Kilo activation: update research state"
          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Kilo activation outcome: $KILO_OUTCOME"

      - name: Report Kilo outcome
        if: always()
        env:
          KILO_OUTCOME: ${{ steps.kilo.outcome }}
        run: |
          if [ "$KILO_OUTCOME" = "success" ]; then
            echo "Kilo activation completed successfully."
          elif [ "$KILO_OUTCOME" = "skipped" ]; then
            echo "Kilo activation was skipped."
          else
            echo "Kilo activation ended with outcome: $KILO_OUTCOME"
            exit 1
          fi
