        id: deep_audit_final
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --final
          rc=$?
          echo "DEEP_AUDIT_FINAL_RC=$rc"
          exit 0