name: Kilo Research Sequential Learning Campaign

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      campaign_mode:
        description: "Run the full 10-agent campaign or a cheap 2-agent miniature using the exact same architecture."
        required: true
        default: "full"
        type: choice
        options:
          - full
          - miniature
permissions:
  contents: write

jobs:
  campaign:
    name: Autonomous Kilo activation
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        id: audit_source_1_checkout_repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deep audit — after Checkout repository
        id: deep_audit_1_checkout_repository
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_1_checkout_repository.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Checkout repository"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Synchronize activation workspace to latest branch tip
        id: audit_source_2_synchronize_activation_workspace_to_latest_branc
        run: |
          set -euo pipefail
          event_sha="$GITHUB_SHA"
          git fetch --prune origin "$GITHUB_REF_NAME"
          latest_branch_sha="$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          git reset --hard "$latest_branch_sha"
          echo "Activation event SHA: $event_sha"
          echo "Synchronized research workspace to origin/$GITHUB_REF_NAME at $latest_branch_sha."

      - name: Deep audit — after Synchronize activation workspace to latest branch tip
        id: deep_audit_2_synchronize_activation_workspace_to_latest_branc
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_2_synchronize_activation_workspace_to_latest_branc.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Synchronize activation workspace to latest branch tip"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Install Kilo Code CLI
        id: audit_source_3_install_kilo_code_cli
        run: npm install -g @kilocode/cli

      - name: Deep audit — after Install Kilo Code CLI
        id: deep_audit_3_install_kilo_code_cli
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_3_install_kilo_code_cli.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Install Kilo Code CLI"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Verify Kilo installation
        id: verify_install
        run: kilo --version

      - name: Deep audit — after Verify Kilo installation
        id: deep_audit_4_verify_kilo_installation
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.verify_install.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Verify Kilo installation"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Install research Python dependencies
        id: research_python
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/x-python"
          "$RUNNER_TEMP/x-python/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r research/backtest/requirements.txt \
            pytest
          "$RUNNER_TEMP/x-python/bin/python" - <<'PY'
          import numpy
          print(f"Research Python environment ready; NumPy {numpy.__version__}.")
          PY
          echo "$RUNNER_TEMP/x-python/bin" >> "$GITHUB_PATH"
      - name: Deep audit — after Install research Python dependencies
        id: deep_audit_5_install_research_python_dependencies
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.research_python.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Install research Python dependencies"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Diagnose Kilo API key
        id: kilo_auth
        continue-on-error: true
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$KILO_API_KEY" ]; then
            echo "KILO_API_KEY_CHECK=NOT_CONFIGURED"
            {
              echo "### Kilo API key diagnostic"
              echo "KILO_API_KEY: **not configured**"
              echo
              echo "The research workflow does not require the key because the selected model is free."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/kilo-profile-response --write-out '%{http_code}' \
            -H "Authorization: Bearer $KILO_API_KEY" \
            -H "Accept: application/json" \
            https://api.kilo.ai/api/profile || true)"

          case "$status" in
            200)
              echo "KILO_API_KEY_CHECK=VALID"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **valid** — authenticated Kilo profile request returned HTTP 200."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            401)
              echo "::error::KILO_API_KEY_CHECK=INVALID"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **invalid or rejected** — Kilo returned HTTP 401."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::warning::KILO_API_KEY_CHECK=UNVERIFIED"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **unverified** — Kilo profile endpoint returned HTTP $status rather than 200 or 401."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

      - name: Deep audit — after Diagnose Kilo API key
        id: deep_audit_6_diagnose_kilo_api_key
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.kilo_auth.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Diagnose Kilo API key"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Discover a currently available free model
        id: discover_model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = "https://api.kilo.ai/api/gateway/models"
          request = Request(url, headers={"Accept": "application/json"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)

          models = payload.get("data", [])
          free = [
              m for m in models
              if isinstance(m.get("id"), str) and m["id"].endswith(":free")
          ]

          preferred = [
              "minimax/minimax-m2.1:free",
              "z-ai/glm-5:free",
          ]

          selected = None
          for model_id in preferred:
              candidate = next((m for m in free if m.get("id") == model_id), None)
              if candidate:
                  selected = candidate
                  break

          if selected is None:
              def tool_capable(model):
                  values = model.get("supported_parameters") or []
                  return bool(
                      model.get("tool_calling")
                      or model.get("tool_call")
                      or any(str(v).lower() in {"tools", "tool_choice"} for v in values)
                  )

              candidates = [m for m in free if tool_capable(m)]
              candidates.sort(key=lambda m: m.get("id", ""))
              if candidates:
                  selected = candidates[0]

          if selected is None:
              ids = sorted(str(m.get("id")) for m in free if m.get("id"))
              raise SystemExit(
                  "No suitable tool-capable free Kilo model was found. "
                  f"Available free IDs: {ids[:40]}"
              )

          model_id = selected["id"]
          model_name = selected.get("name") or model_id

          with open("/tmp/kilo-free-model-id", "w", encoding="utf-8") as f:
              f.write(model_id)

          with open("/tmp/kilo-free-model-name", "w", encoding="utf-8") as f:
              f.write(model_name)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"KILO_FREE_MODEL_ID={model_id}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Free model discovery\n")
              f.write(f"Selected current free model: `{model_id}`\n")
              f.write("Model selection came from Kilo's live `/models` catalogue.\n")

          print(f"Selected current free model: {model_id}")
          PY

      - name: Deep audit — after Discover a currently available free model
        id: deep_audit_7_discover_a_currently_available_free_model
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.discover_model.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Discover a currently available free model"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Prepare trusted Kilo research configuration
        id: audit_source_8_prepare_trusted_kilo_research_configuration
        run: |
          set -euo pipefail
          test -n "$KILO_FREE_MODEL_ID"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          model_id = os.environ["KILO_FREE_MODEL_ID"]
          model_name = Path("/tmp/kilo-free-model-name").read_text(encoding="utf-8")

          config = {
              "$schema": "https://app.kilo.ai/config.json",
              "enabled_providers": ["openai-compatible"],
              "model": "openai-compatible/free-kilo",
              "small_model": "openai-compatible/free-kilo",
              "subagent_model": "openai-compatible/free-kilo",
              "provider": {
                  "openai-compatible": {
                      "options": {
                          "baseURL": "https://api.kilo.ai/api/gateway"
                      },
                      "models": {
                          "free-kilo": {
                              "id": model_id,
                              "name": model_name,
                              "tool_call": True
                          }
                      }
                  }
              },
              "sandbox": {
                  "enabled": False,
                  "network": "allow",
                  "allowed_hosts": [
                      "github.com:443",
                      "api.github.com:443",
                      "raw.githubusercontent.com:443",
                      "api.kilo.ai:443",
                      "pypi.org:443",
                      "files.pythonhosted.org:443",
                      "registry.npmjs.org:443"
                  ]
              }
          }

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)

          print(f"Prepared secretless Kilo research config for {model_id}.")
          PY

      - name: Deep audit — after Prepare trusted Kilo research configuration
        id: deep_audit_8_prepare_trusted_kilo_research_configuration
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_8_prepare_trusted_kilo_research_configuration.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Prepare trusted Kilo research configuration"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Validate trusted Kilo configuration
        id: audit_source_9_validate_trusted_kilo_configuration
        run: |
          set -euo pipefail
          test "$(stat -c '%a' "$HOME/.config/kilo/kilo.json")" = "600"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          config = json.loads(path.read_text(encoding="utf-8"))

          assert config["enabled_providers"] == ["openai-compatible"]
          assert config["model"] == "openai-compatible/free-kilo"
          assert config["small_model"] == "openai-compatible/free-kilo"
          assert config["subagent_model"] == "openai-compatible/free-kilo"

          gateway = config["provider"]["openai-compatible"]
          assert gateway["options"]["baseURL"] == "https://api.kilo.ai/api/gateway"
          assert "apiKey" not in gateway["options"]

          model = gateway["models"]["free-kilo"]
          assert model["id"].endswith(":free")
          assert model["tool_call"] is True

          assert config["sandbox"]["enabled"] is False
          print(f"Trusted Kilo configuration validated for {model['id']}.")
          PY

      - name: Deep audit — after Validate trusted Kilo configuration
        id: deep_audit_9_validate_trusted_kilo_configuration
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.audit_source_9_validate_trusted_kilo_configuration.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Validate trusted Kilo configuration"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Research readiness preflight
        id: preflight
        timeout-minutes: 15
        run: |
          set -euo pipefail

          echo "=== Research readiness preflight ==="
          # The activation workspace is intentionally synchronized to the latest branch
          # tip immediately after checkout so queued activations do not research against
          # a stale event SHA. GITHUB_SHA remains the triggering event identity.
          git show-ref --verify --quiet "refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          test -z "$(git status --porcelain)"
          test ! -e .git/index.lock

          # Recovery branches are durable quarantine state. Surface the newest
          # one to the next activation without merging or modifying it.
          recovery_refs="$(git ls-remote --heads origin 'refs/heads/recovery/kilo-run-*' 2>/dev/null | awk '{print $2}' | sed 's#refs/heads/##' | sort -V || true)"
          if [ -n "$recovery_refs" ]; then
            latest_recovery_branch="$(printf '%s\n' "$recovery_refs" | tail -n 1)"
            echo "KILO_RECOVERY_BRANCH=$latest_recovery_branch" >> "$GITHUB_ENV"
            echo "::notice::Recovery branch awaiting inspection: $latest_recovery_branch"
            {
              echo "### Existing Kilo recovery state"
              echo "Newest recovery branch: `$latest_recovery_branch`"
              echo "The worker must inspect this quarantine state before starting unrelated new research."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Activation event SHA: $GITHUB_SHA"
          echo "Research workspace SHA: $(git rev-parse HEAD)"

          for required in             AGENTS.md             ENTERPRISE.md             PERSISTENCE_POLICY.md             .kilo/wakeup-prompt.md             research/METHODOLOGY.md             research/data/manifest.json             research/data/preflight.py             state/STATE.md             state/activation_status.json             logs/README.md; do
            test -s "$required"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("research/data/manifest.json").read_text())
          universe = manifest.get("universe")
          entries = manifest.get("entries")
          if not isinstance(universe, list) or not universe:
              raise SystemExit("research manifest has no universe")
          if not isinstance(entries, list) or len(entries) != len(universe):
              raise SystemExit("research manifest universe/entry cardinality mismatch")
          entry_tickers = [e.get("ticker") for e in entries]
          if sorted(entry_tickers) != sorted(universe):
              raise SystemExit("research manifest ticker set mismatch")
          receipt = json.loads(Path("state/activation_status.json").read_text())
          required_receipt = {"activation_id","status","objective","phase","changed","verified","unverified","next"}
          missing = required_receipt - set(receipt)
          if missing:
              raise SystemExit(f"activation receipt missing fields: {sorted(missing)}")
          if not isinstance(receipt["changed"], list) or not isinstance(receipt["verified"], list) or not isinstance(receipt["unverified"], list):
              raise SystemExit("activation receipt list fields have invalid types")
          print(f"Manifest preflight OK: {len(universe)}-asset fixed universe.")
          print(f"Existing receipt status: {receipt['status']}; prior activation {receipt['activation_id']}.")
          PY

          echo "Checking sequential campaign architecture and the focused-task firewall..."
          ! grep -Eiq "TRANSIENT_GATEWAY_RETRY_ONCE|retrying the same worker workspace once|rerun_workflow" .github/workflows/kilo-wakeup.yml .github/workflows/kilo-prompt-execution-one-shot.yml
          ! grep -q "report_kilo_outcome.py" .github/workflows/kilo-wakeup.yml
          python3 -m unittest tests.test_campaign_architecture
          echo "Running deterministic real-data preflight..."
          if ! python3 research/data/preflight.py > /tmp/x-data-preflight.log 2>&1; then
            echo "Deterministic data preflight failed; emitting its full diagnostic:"
            cat /tmp/x-data-preflight.log
            exit 1
          fi
          tail -n 25 /tmp/x-data-preflight.log
          grep -q "PREFLIGHT PASSED" /tmp/x-data-preflight.log

          echo "Running complete deterministic regression suite..."
          if ! python3 -m unittest discover -s tests -v > /tmp/x-regression.log 2>&1; then
            echo "Deterministic regression suite failed; emitting its diagnostic:"
            tail -n 120 /tmp/x-regression.log
            exit 1
          fi
          tail -n 35 /tmp/x-regression.log
          grep -q "OK" /tmp/x-regression.log

          echo "Running bounded real-data end-to-end readiness example..."
          python3 examples/regime_stability_universe.py > /tmp/x-e2e-preflight.log 2>&1
          tail -n 35 /tmp/x-e2e-preflight.log

          echo "RESEARCH_PREFLIGHT=PASS"
      - name: Deep audit — after Research readiness preflight
        id: deep_audit_10_research_readiness_preflight
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Research readiness preflight"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0
      - name: Smoke-test real Kilo execution path
        id: kilo_smoke
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/kilo-smoke
          mkdir -p /tmp/kilo-smoke
          cat > /tmp/kilo-smoke/prompt.txt <<'EOF'
          Use the available shell/tool capability to create exactly one file:
            /tmp/kilo-smoke/sentinel.txt
          Create the file and verify that it exists and is non-empty.
          Do not modify the Git repository and stop after verification.
          EOF
          cd /tmp/kilo-smoke
          kilo run --model openai-compatible/free-kilo --auto "$(cat /tmp/kilo-smoke/prompt.txt)" > /tmp/kilo-smoke.log 2>&1
          status=$?
          cat /tmp/kilo-smoke.log
          test "$status" -eq 0
          test -s /tmp/kilo-smoke/sentinel.txt
          test -s /tmp/kilo-smoke/sentinel.txt
          echo "Smoke sentinel contents (model-chosen): $(cat /tmp/kilo-smoke/sentinel.txt)"
          echo "Representative Kilo execution-path smoke test passed."
      - name: Deep audit — after Smoke-test real Kilo execution path
        id: deep_audit_11_smoke_test_real_kilo_execution_path
        if: always()
        continue-on-error: true
        env:
          AUDIT_PREV_OUTCOME: ${{ steps.kilo_smoke.outcome }}
        run: |
          set +e
          python3 .github/scripts/deep_workflow_audit.py --profile xwake --step "Smoke-test real Kilo execution path"
          rc=$?
          echo "DEEP_AUDIT_RC=$rc"
          exit 0

      - name: Initialize campaign controller
        id: campaign_init
        if: steps.preflight.outcome == 'success' && steps.kilo_smoke.outcome == 'success'
        run: |
          set -euo pipefail
          mode="${{ inputs.campaign_mode || 'full' }}"
          if [ "$mode" = "miniature" ]; then
            agent_count=2
          else
            agent_count=10
          fi
          python3 .github/scripts/campaign_controller.py init --run-id "$GITHUB_RUN_ID" --agent-count "$agent_count"
          echo "CAMPAIGN_AGENT_COUNT=$agent_count" >> "$GITHUB_ENV"
          echo "CAMPAIGN_MODE=$mode" >> "$GITHUB_ENV"

      - name: Select Agent 01 focused task
        id: select_agent_01
        if: ${{ always() && steps.campaign_init.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/campaign_controller.py select --run-id "$GITHUB_RUN_ID" --agent-number 01 > "$RUNNER_TEMP/agent_01_selection.json"

      - name: Agent 01 — Learning Process — Fresh Kilo session
        id: agent_01
        if: ${{ always() && steps.select_agent_01.outcome == 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail
          python3 .github/scripts/campaign_controller.py render-prompt --run-id "$GITHUB_RUN_ID" --agent-number 01 > "$RUNNER_TEMP/agent_01_prompt.txt"
          python3 .github/scripts/run_campaign_agent.py \
            --run-id "$GITHUB_RUN_ID" \
            --agent-number 01 \
            --model "$KILO_FREE_MODEL_ID" \
            --prompt-file "$RUNNER_TEMP/agent_01_prompt.txt"

      - name: Validate Agent 01 focused-task checkpoint
        id: validate_agent_01
        if: ${{ always() && steps.select_agent_01.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          worker_exit=1
          if [ "${{ steps.agent_01.outcome }}" = "success" ]; then
            worker_exit=0
          fi
          python3 .github/scripts/validate_campaign_agent.py \
            --run-id "$GITHUB_RUN_ID" \
            --agent-number 01 \
            --worker-exit-code "$worker_exit"
          validation_rc=$?
          set -e
          echo "Agent 01 controller validation exit: $validation_rc"
          cat "state/campaign/runs/$GITHUB_RUN_ID/agents/agent_01_validation.json" 2>/dev/null || true
          exit 0

      - name: Select Agent 02 focused task
        id: select_agent_02
        if: ${{ always() && steps.campaign_init.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/campaign_controller.py select --run-id "$GITHUB_RUN_ID" --agent-number 02 > "$RUNNER_TEMP/agent_02_selection.json"

      - name: Agent 02 — Higher-Order Objective — Fresh Kilo session
        id: agent_02
        if: ${{ always() && steps.select_agent_02.outcome == 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail
          python3 .github/scripts/campaign_controller.py render-prompt --run-id "$GITHUB_RUN_ID" --agent-number 02 > "$RUNNER_TEMP/agent_02_prompt.txt"
          python3 .github/scripts/run_campaign_agent.py \
            --run-id "$GITHUB_RUN_ID" \
            --agent-number 02 \
            --model "$KILO_FREE_MODEL_ID" \
            --prompt-file "$RUNNER_TEMP/agent_02_prompt.txt"

      - name: Validate Agent 02 focused-task checkpoint
        id: validate_agent_02
        if: ${{ always() && steps.select_agent_02.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          worker_exit=1
          if [ "${{ steps.agent_02.outcome }}" = "success" ]; then
            worker_exit=0
          fi
          python3 .github/scripts/validate_campaign_agent.py \
            --run-id "$GITHUB_RUN_ID" \
            --agent-number 02 \
            --worker-exit-code "$worker_exit"
          validation_rc=$?
          set -e
          echo "Agent 02 controller validation exit: $validation_rc"
          cat "state/campaign/runs/$GITHUB_RUN_ID/agents/agent_02_validation.json" 2>/dev/null || true
          exit 0

      - name: Select Agent 03 focused task
        id: select_agent_03
        if: ${{ always() && steps.campaign_init.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.campaign_mode != 'miniature') }}
        run: |
          set -euo pipefail
          python3 .github/scripts/campaign_controller.py select --run-id "$GITHUB_RUN_ID" --agent-number 03 > "$RUNNER_TEMP/agent_03_selection.json"

