            --independent-verify "$RESEARCH_VERIFY_OUTCOME"
          rc=$?
          set -e
          echo "Final synthesis exit: $rc"
          exit 0

      - name: Persist validated campaign state
        id: persist
        if: always() && steps.campaign_init.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ROOT="state/campaign/runs/$GITHUB_RUN_ID"
          if [ ! -s "$RUN_ROOT/final_synthesis.json" ]; then
            echo "::error::Final synthesis record is missing."
            exit 1
          fi
          git restore --worktree --staged -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md PERSISTENCE_POLICY.md 2>/dev/null || true
          git add -A
          git diff --check
          if git diff --cached --name-only | grep -E '(^|/)(\.github/workflows/|\.kilo/)|^(AGENTS\.md|ENTERPRISE\.md|MANUAL_SETUP\.md|PERSISTENCE_POLICY\.md)$'; then
            echo "::error::Protected control-plane paths are staged."
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|id_ecdsa|id_ed25519|credentials\.(json|ya?ml|toml)|secrets\.(json|ya?ml|toml))$|\.(pem|key)$'; then
            echo "::error::Credential-like paths are staged."
            exit 1
          fi
          if git diff --cached --binary | grep -E -n 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|kilo_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}'; then
            echo "::error::Potential credential material detected."
            exit 1
          fi
          if git diff --cached --summary | grep -E '^ create mode 120000 '; then
            echo "::error::Symbolic links are not allowed to persist."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "PERSISTENCE_STATUS=NO_CHANGES" >> "$GITHUB_ENV"
            exit 0
          fi
          persistence="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path("state/campaign/runs") / os.environ["GITHUB_RUN_ID"] / "final_synthesis.json").read_text())["persistence_decision"])')"
          git config user.name "kilo-research-enterprise"
          git config user.email "kilo-research-enterprise@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if [ "$persistence" = "MAIN" ]; then
            git commit -m "Kilo campaign: persist validated learning state"
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "PERSISTENCE_STATUS=MAIN" >> "$GITHUB_ENV"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
          fi
          git commit -m "Kilo campaign: preserve recovery state"
          local_commit="$(git rev-parse HEAD)"
          recovery_branch="recovery/kilo-campaign-$GITHUB_RUN_ID-" + ${{ github.run_attempt }}
          git push origin "$local_commit:refs/heads/$recovery_branch"
          echo "PERSISTENCE_STATUS=RECOVERY_BRANCH" >> "$GITHUB_ENV"
          echo "PERSISTENCE_RECOVERY_BRANCH=$recovery_branch" >> "$GITHUB_ENV"

      - name: Report campaign outcome
        id: report_campaign
        if: always() && steps.campaign_init.outcome == 'success'
        run: |
          set -euo pipefail
          python3 .github/scripts/report_campaign_outcome.py --run-id "$GITHUB_RUN_ID"

