name: Kilo Research Enterprise Wake

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: kilo-research-enterprise-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kilo:
    name: Autonomous Kilo activation
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Kilo Code CLI
        run: npm install -g @kilocode/cli

      - name: Verify Kilo installation
        run: kilo --version

      - name: Diagnose Kilo API key
        id: kilo_auth
        continue-on-error: true
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$KILO_API_KEY" ]; then
            echo "KILO_API_KEY_CHECK=NOT_CONFIGURED"
            {
              echo "### Kilo API key diagnostic"
              echo "KILO_API_KEY: **not configured**"
              echo
              echo "The research workflow does not require the key because the selected model is free."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/kilo-profile-response --write-out '%{http_code}' \
            -H "Authorization: Bearer $KILO_API_KEY" \
            -H "Accept: application/json" \
            https://api.kilo.ai/api/profile || true)"

          case "$status" in
            200)
              echo "KILO_API_KEY_CHECK=VALID"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **valid** — authenticated Kilo profile request returned HTTP 200."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            401)
              echo "::error::KILO_API_KEY_CHECK=INVALID"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **invalid or rejected** — Kilo returned HTTP 401."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "::warning::KILO_API_KEY_CHECK=UNVERIFIED"
              {
                echo "### Kilo API key diagnostic"
                echo "KILO_API_KEY: **unverified** — Kilo profile endpoint returned HTTP $status rather than 200 or 401."
                echo
                echo "The key itself was not printed or persisted."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

      - name: Discover a currently available free model
        id: discover_model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = "https://api.kilo.ai/api/gateway/models"
          request = Request(url, headers={"Accept": "application/json"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)

          models = payload.get("data", [])
          free = [
              m for m in models
              if isinstance(m.get("id"), str) and m["id"].endswith(":free")
          ]

          preferred = [
              "minimax/minimax-m2.1:free",
              "z-ai/glm-5:free",
          ]

          selected = None
          for model_id in preferred:
              candidate = next((m for m in free if m.get("id") == model_id), None)
              if candidate:
                  selected = candidate
                  break

          if selected is None:
              def tool_capable(model):
                  values = model.get("supported_parameters") or []
                  return bool(
                      model.get("tool_calling")
                      or model.get("tool_call")
                      or any(str(v).lower() in {"tools", "tool_choice"} for v in values)
                  )

              candidates = [m for m in free if tool_capable(m)]
              candidates.sort(key=lambda m: m.get("id", ""))
              if candidates:
                  selected = candidates[0]

          if selected is None:
              ids = sorted(str(m.get("id")) for m in free if m.get("id"))
              raise SystemExit(
                  "No suitable tool-capable free Kilo model was found. "
                  f"Available free IDs: {ids[:40]}"
              )

          model_id = selected["id"]
          model_name = selected.get("name") or model_id

          with open("/tmp/kilo-free-model-id", "w", encoding="utf-8") as f:
              f.write(model_id)

          with open("/tmp/kilo-free-model-name", "w", encoding="utf-8") as f:
              f.write(model_name)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"KILO_FREE_MODEL_ID={model_id}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Free model discovery\n")
              f.write(f"Selected current free model: `{model_id}`\n")
              f.write("Model selection came from Kilo's live `/models` catalogue.\n")

          print(f"Selected current free model: {model_id}")
          PY

      - name: Prepare trusted Kilo research configuration
        run: |
          set -euo pipefail
          test -n "$KILO_FREE_MODEL_ID"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          model_id = os.environ["KILO_FREE_MODEL_ID"]
          model_name = Path("/tmp/kilo-free-model-name").read_text(encoding="utf-8")

          config = {
              "$schema": "https://app.kilo.ai/config.json",
              "enabled_providers": ["openai-compatible"],
              "model": "openai-compatible/free-kilo",
              "small_model": "openai-compatible/free-kilo",
              "subagent_model": "openai-compatible/free-kilo",
              "provider": {
                  "openai-compatible": {
                      "options": {
                          "baseURL": "https://api.kilo.ai/api/gateway"
                      },
                      "models": {
                          "free-kilo": {
                              "id": model_id,
                              "name": model_name,
                              "tool_call": True
                          }
                      }
                  }
              },
              "sandbox": {
                  "enabled": False,
                  "network": "allow",
                  "allowed_hosts": [
                      "github.com:443",
                      "api.github.com:443",
                      "raw.githubusercontent.com:443",
                      "api.kilo.ai:443",
                      "pypi.org:443",
                      "files.pythonhosted.org:443",
                      "registry.npmjs.org:443"
                  ]
              }
          }

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)

          print(f"Prepared secretless Kilo research config for {model_id}.")
          PY

      - name: Validate trusted Kilo configuration
        run: |
          set -euo pipefail
          test "$(stat -c '%a' "$HOME/.config/kilo/kilo.json")" = "600"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          config = json.loads(path.read_text(encoding="utf-8"))

          assert config["enabled_providers"] == ["openai-compatible"]
          assert config["model"] == "openai-compatible/free-kilo"
          assert config["small_model"] == "openai-compatible/free-kilo"
          assert config["subagent_model"] == "openai-compatible/free-kilo"

          gateway = config["provider"]["openai-compatible"]
          assert gateway["options"]["baseURL"] == "https://api.kilo.ai/api/gateway"
          assert "apiKey" not in gateway["options"]

          model = gateway["models"]["free-kilo"]
          assert model["id"].endswith(":free")
          assert model["tool_call"] is True

          assert config["sandbox"]["enabled"] is False
          print(f"Trusted Kilo configuration validated for {model['id']}.")
          PY

      - name: Smoke-test real Kilo execution path
        id: kilo_smoke
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -rf /tmp/kilo-smoke
          mkdir -p /tmp/kilo-smoke
          cat > /tmp/kilo-smoke/prompt.txt <<'EOF'
Use the available shell/tool capability to create exactly one file:
  /tmp/kilo-smoke/sentinel.txt
The complete contents must be exactly SMOKE_OK.
Do not modify the Git repository. Verify the file contents and stop.
EOF
          cd /tmp/kilo-smoke
          kilo run --model openai-compatible/free-kilo --auto "$(cat /tmp/kilo-smoke/prompt.txt)" > /tmp/kilo-smoke.log 2>&1
          status=$?
          cat /tmp/kilo-smoke.log
          test "$status" -eq 0
          test -s /tmp/kilo-smoke/sentinel.txt
          test "$(cat /tmp/kilo-smoke/sentinel.txt)" = "SMOKE_OK"
          echo "Representative Kilo execution-path smoke test passed."
      - name: Run Kilo
        id: kilo
        if: steps.kilo_smoke.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 340
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set +e

          # A fresh Kilo session is intentionally retried only for the specific
          # gateway/provider failure observed in run #35. Other failures remain
          # hard failures so the workflow cannot hide genuine defects.
          kilo run --model openai-compatible/free-kilo --auto "$(cat .kilo/wakeup-prompt.md)" > /tmp/kilo-primary.log 2>&1
          status=$?
          cat /tmp/kilo-primary.log

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq 'invalid request error trace_id:' /tmp/kilo-primary.log; then
            echo "::warning::Kilo gateway returned a transient invalid-request trace; retrying once with a fresh Kilo session."
            sleep 5
            kilo run --model openai-compatible/free-kilo --auto "$(cat .kilo/wakeup-prompt.md)" > /tmp/kilo-retry.log 2>&1
            retry_status=$?
            cat /tmp/kilo-retry.log
            exit "$retry_status"
          fi

          exit "$status"

      - name: Independently verify activation evidence
        id: verify
        if: always() && steps.kilo.outcome != 'skipped'
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only | grep -E '(^|/)(\.github/workflows/|\.kilo/)|^(AGENTS\.md|ENTERPRISE\.md|MANUAL_SETUP\.md|PERSISTENCE_POLICY\.md)$' >/tmp/verify_protected; then
            echo "Protected control-plane paths were changed by the worker:"
            cat /tmp/verify_protected
            exit 1
          fi
          test -f state/activation_status.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("state/activation_status.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          required = {"activation_id","status","objective","phase","changed","verified","unverified","next"}
          missing = required - set(d)
          if missing:
              raise SystemExit(f"missing receipt fields: {sorted(missing)}")
          allowed = {"COMPLETE","PARTIAL","FAILED","BLOCKED","QUARANTINED","NO_SUBSTANTIVE_ACTION"}
          if d["status"] not in allowed:
              raise SystemExit("invalid activation status")
          if str(d["activation_id"]) != os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("receipt activation_id does not match current run")
          for key in ("changed","verified","unverified"):
              if not isinstance(d[key], list):
                  raise SystemExit(f"receipt field {key} must be a list")
          if not all(isinstance(d[k], str) and d[k].strip() for k in ("objective","phase","next")):
              raise SystemExit("receipt objective/phase/next must be non-empty strings")
          print("Activation receipt independently schema-validated.")
          PY
          echo "Independent repository/evidence gate passed."
      - name: Persist safe repository changes
        id: persist
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PERSISTENCE_STATUS=FAILED" >> "$GITHUB_ENV"
          git restore --worktree --staged -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md PERSISTENCE_POLICY.md 2>/dev/null || true
          git reset -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md PERSISTENCE_POLICY.md 2>/dev/null || true
          git add -A
          git reset -- \
            ':(glob)**/__pycache__/**' \
            ':(glob)**/*.pyc' \
            ':(glob)**/*.py.c' 2>/dev/null || true
          if git diff --cached --name-only | grep -E '(^|/)(\.github/workflows/|\.kilo/)|^(AGENTS\.md|ENTERPRISE\.md|MANUAL_SETUP\.md|PERSISTENCE_POLICY\.md)$' >/tmp/protected; then
            echo "Protected paths unexpectedly staged:"
            cat /tmp/protected
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|id_ecdsa|id_ed25519|credentials\.(json|ya?ml|toml)|secrets\.(json|ya?ml|toml))$|\.(pem|key)$' >/tmp/credential_paths; then
            echo "Credential-like paths are not allowed to persist:"
            cat /tmp/credential_paths
            exit 1
          fi
          if git diff --cached --binary | grep -E -n 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|kilo_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}' >/tmp/secrets; then
            echo "Potential credential material detected:"
            cat /tmp/secrets
            exit 1
          fi
          if git diff --cached --summary | grep -E '^ create mode 120000 ' >/tmp/symlinks; then
            echo "Symbolic links are not allowed to persist:"
            cat /tmp/symlinks
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No safe repository changes to persist."
            echo "PERSISTENCE_STATUS=NO_CHANGES" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "kilo-research-enterprise"
          git config user.email "kilo-research-enterprise@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git commit -m "Kilo activation: update research state"
          local_commit="$(git rev-parse HEAD)"
          git fetch origin "$GITHUB_REF_NAME"
          if git rebase "origin/$GITHUB_REF_NAME"; then
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "PERSISTENCE_STATUS=MAIN" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          git rebase --abort >/dev/null 2>&1 || true
          recovery_branch="recovery/kilo-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "${local_commit}:refs/heads/${recovery_branch}"
          echo "PERSISTENCE_STATUS=RECOVERY_BRANCH" >> "$GITHUB_ENV"
          echo "PERSISTENCE_RECOVERY_BRANCH=${recovery_branch}" >> "$GITHUB_ENV"
          echo "::warning::Main integration failed; worker commit preserved on ${recovery_branch}."
      - name: Report Kilo outcome
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.kilo_smoke.outcome }}
          KILO_OUTCOME: ${{ steps.kilo.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PERSISTENCE_STATUS: ${{ env.PERSISTENCE_STATUS }}
          PERSISTENCE_RECOVERY_BRANCH: ${{ env.PERSISTENCE_RECOVERY_BRANCH }}
        run: |
          set -euo pipefail
          echo "Smoke: ${SMOKE_OUTCOME:-unknown}"
          echo "Kilo: ${KILO_OUTCOME:-unknown}"
          echo "Verifier: ${VERIFY_OUTCOME:-unknown}"
          echo "Persistence: ${PERSISTENCE_STATUS:-unknown}"
          if [ "${SMOKE_OUTCOME:-}" != "success" ]; then exit 1; fi
          if [ "${KILO_OUTCOME:-}" = "skipped" ]; then exit 1; fi
          if [ "${VERIFY_OUTCOME:-}" != "success" ]; then exit 1; fi
          case "${PERSISTENCE_STATUS:-FAILED}" in
            MAIN)
              if [ "${KILO_OUTCOME:-}" = "success" ]; then
                echo "COMPLETE: worker + verifier + main persistence succeeded."
              else
                echo "PARTIAL: worker was non-zero but research state persisted."
                exit 1
              fi
              ;;
            RECOVERY_BRANCH)
              echo "PARTIAL: research work preserved on ${PERSISTENCE_RECOVERY_BRANCH:-recovery branch}, not integrated into main."
              exit 1
              ;;
            NO_CHANGES)
              echo "NO_SUBSTANTIVE_ACTION: no repository changes required persistence."
              ;;
            *)
              echo "FAILED: persistence reached no trustworthy terminal state."
              exit 1
              ;;
          esac
