name: Cancel Active Enterprise Runs

on:
  push:
    paths:
      - ".control/cancel-enterprise.token"

concurrency:
  group: kilo-research-enterprise-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Intentional no-op cancellation run."
